services:
  - type: web
    name: rescuegrid-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: RESCUEGRID_SECRET
        generateValue: true
      - key: RESCUEGRID_CORS
        sync: false
